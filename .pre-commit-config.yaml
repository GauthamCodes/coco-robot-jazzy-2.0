# Pre-commit hooks for Coco Robot ROS2
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: ['--max-line-length=120', '--ignore=E203,W503']
        files: \.py$

# No black/isort on purpose. The real style gate for this repo is ament's
# flake8 + pep257, which `colcon test` enforces and which the tree passes.
# The sources are hand-wrapped at ~79 columns with aligned section
# comments; running `black --line-length 100` over them would reformat
# every Python file and destroy that layout for no functional gain. If you
# want an autoformatter, adopt it deliberately in its own commit rather
# than discovering it via a pre-commit run.
