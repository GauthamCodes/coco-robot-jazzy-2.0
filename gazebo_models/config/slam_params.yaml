# slam_toolbox (online async) params for the Coco robot
slam_toolbox:
  ros__parameters:
    use_sim_time: true

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI

    resolution: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.2
    transform_publish_period: 0.02
    map_update_interval: 2.0

    # Fine thresholds: process scans often during turns so the matcher can
    # correct skid-steer odometry drift before it accumulates.
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    scan_buffer_size: 20
    loop_search_maximum_distance: 4.0
    do_loop_closing: true

    # Wider correlation search so the matcher can pull the pose back when
    # skid-steer odometry under/over-rotates during in-place turns.
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_match_minimum_response_fine: 0.45

    # The lanes beside the walled ramp are ~2 m corridors: two long parallel
    # walls leave the scan match unconstrained along the corridor axis, and
    # an unpenalized matcher will happily slide/rotate the pose there. Raise
    # the cost of deviating from odometry so degenerate stretches lean on
    # the wheel odom instead of a runaway match.
    distance_variance_penalty: 0.8
    angle_variance_penalty: 1.8
