# C2-NAV.40. The shipped config and the baseline protocol (1 repeat per fresh
# simulator, 75 s per leg) with ONE change: enclosure_entry's goal moves from
# (-3.45, 2.95) to C2-NAV.7's corridor centre (-3.575, 2.95), the x in
# [-3.650, -3.500] band that clears PolygonStop.radius from both wall_west and
# box_obstacle_1. No nav2 parameter changes; the goal goes to nav_bench.py's
# existing --goal override.
name: entry_corridor_centre
description: baseline tour with enclosure_entry's goal at the C2-NAV.7 corridor centre
bench:
  goals:
    enclosure_entry: [-3.575, 2.95]
