# coco_controllers.yaml
# =====================
# Unified ros2_control config for the Coco robot (Layer 1, Jazzy).
#   - diff_drive_controller : all four wheels (2 per side)
#   - arm_controller        : 2-DOF arm via JointTrajectoryController
#                             (holds position on activation -> no free-swing
#                             oscillation at spawn, and MoveIt2-ready)
#   - gripper_controller    : both finger joints via JointTrajectoryController
#
# Note (Jazzy): diff_drive_controller subscribes to ~/cmd_vel as
# geometry_msgs/TwistStamped only — plain Twist support was removed.

controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController


diff_drive_controller:
  ros__parameters:
    use_sim_time: true

    # wheel1/2 = right side, wheel3/4 = left side (see coco_robo2.xacro)
    left_wheel_names:  ["base_Revolute-3", "base_Revolute-4"]
    right_wheel_names: ["base_Revolute-1", "base_Revolute-2"]

    wheel_separation: 0.274
    wheel_radius:     0.0585

    # >1 compensates skid-steer yaw loss (4 fixed wheels must slip laterally
    # to turn); tuned against ground truth in Gazebo Harmonic
    wheel_separation_multiplier:   1.10
    left_wheel_radius_multiplier:  1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate:   50.0
    odom_frame_id:  odom
    base_frame_id:  base_footprint
    enable_odom_tf: true
    open_loop:      false

    pose_covariance_diagonal:  [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    cmd_vel_timeout: 0.5

    linear.x.max_velocity:  1.0
    linear.x.min_velocity: -1.0
    linear.x.max_acceleration:  2.0
    linear.x.min_acceleration: -2.0
    angular.z.max_velocity:  2.0
    angular.z.min_velocity: -2.0
    angular.z.max_acceleration:  4.0
    angular.z.min_acceleration: -4.0


arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - m_link1_Revolute-6
      - m_link2_Revolute-7
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0


gripper_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - m_link3_Revolute-8
      - m_link3_Revolute-9
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
