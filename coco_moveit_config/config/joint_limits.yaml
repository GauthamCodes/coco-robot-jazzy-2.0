# Joint limits used by MoveIt for time parameterization.
# Positions match coco_robo2.xacro; acceleration limits added here because
# the URDF format cannot express them.
joint_limits:
  m_link1_Revolute-6:
    has_velocity_limits: true
    max_velocity: 1.5
    has_acceleration_limits: true
    max_acceleration: 3.0
  m_link2_Revolute-7:
    has_velocity_limits: true
    max_velocity: 1.5
    has_acceleration_limits: true
    max_acceleration: 3.0
  m_link3_Revolute-8:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
  m_link3_Revolute-9:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
