version: '3.8'

services:
  coco-robot:
    build: .
    image: coco-robot-ros2:latest
    container_name: coco-robot-dev
    privileged: true
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - .:/workspace:rw
    command: /bin/bash
