# COCO 2.0 — local single-user platform.
#
#   docker compose build
#   docker compose up
#   open http://localhost:8080
#
# ONE service, on purpose. TASK 8 sketched a coco/web split and then said
# the split should follow the existing architecture and not separate ROS
# nodes without reason. platform_server IS a ROS 2 node: it subscribes to
# odometry, the scan, the plan and the mission state, and publishes to an
# arbiter input. Putting it in a second container means running a DDS
# graph across containers -- shared network namespace, matching
# CYCLONEDDS_URI, discovery that fails in ways that look like "the robot
# is not moving" -- to gain nothing a single-user appliance wants.
#
# docs/PRODUCT_ARCHITECTURE.md records what the split becomes at P1.1,
# where it stops being optional: one COCO container per session, with the
# web tier in front of many of them.

services:
  coco:
    build:
      context: .
      dockerfile: Dockerfile
      # What the image records about its source (Dockerfile, "Identity").
      # scripts/container/build.sh exports these from git; a bare
      # `docker compose build` records "unknown", which is true.
      args:
        COCO_GIT_SHA: "${COCO_GIT_SHA:-unknown}"
        COCO_GIT_BRANCH: "${COCO_GIT_BRANCH:-unknown}"
        COCO_GIT_DIRTY: "${COCO_GIT_DIRTY:-unknown}"
        COCO_SOURCE_DATE_EPOCH: "${COCO_SOURCE_DATE_EPOCH:-0}"
    # COCO_IMAGE selects a specific build (scripts/container/build.sh tags
    # coco-platform:<sha12>); validate.sh uses it to test that exact image.
    image: "${COCO_IMAGE:-coco-platform:jazzy}"
    container_name: coco-platform
    # The whole stack is one DDS graph inside this container. Publishing
    # only the platform's HTTP port keeps the ROS graph off the host
    # network, which is also what stops it colliding with a coco (or an
    # unrelated project's Gazebo) already running natively on the
    # developer's machine -- a real collision, and the reason ros_clean.sh
    # scopes its sweep to this repo's own worlds.
    #
    # 8081 (web_video_server) is deliberately NOT published: the platform
    # serves the retained MJPEG view itself at :8080/video/<alias> and
    # reaches web_video_server on loopback. Its own URLs take a topic in
    # the query string, so publishing it would hand any browser any image
    # topic on the graph.
    #
    # Published on the host's LOOPBACK by default. The platform has no
    # authentication yet (P1), and a bare "8080:8080" binds every host
    # interface -- the robot's controls on the LAN. COCO_BIND=0.0.0.0 is
    # the deliberate opt-in for a trusted network.
    ports:
      - "${COCO_BIND:-127.0.0.1}:${COCO_HTTP_PORT:-8080}:8080"
    environment:
      COCO_HTTP_PORT: "8080"
      COCO_VIDEO_PORT: "8081"
      COCO_TARGET_COLOUR: "${COCO_TARGET_COLOUR:-blue}"
      COCO_GUI: "false"
      COCO_RVIZ: "false"
      # Extra mission.launch.py arguments; empty = the shipped defaults.
      COCO_MISSION_ARGS: "${COCO_MISSION_ARGS:-}"
    # Gazebo's physics and DDS both want more than the default 64 MB.
    shm_size: "2gb"
    # Nav2 and the RL policy are CPU-bound here; without a GPU the sensor
    # rendering is software. Raise if the sim runs below real time.
    stop_grace_period: 30s
    restart: "no"
    # Least privilege. The image runs as uid 1000 (`coco`), not root, with
    # no Linux capability and no setuid escalation. scripts/container/
    # platform_smoke.sh brings the whole stack up under exactly these
    # settings; docs/DOCKER.md records what it measured. No host path is
    # mounted and the Docker socket never is.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      # The simulator spawn is the slow part, and slower on software
      # rendering. Until this passes the container is "starting", not
      # "unhealthy" -- which is the honest state while Gazebo boots.
      start_period: 180s
      retries: 30
