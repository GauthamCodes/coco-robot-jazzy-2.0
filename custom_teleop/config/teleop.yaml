# Teleop parameters, loaded by teleop.launch.py.
#
# Every value here is the node's own default, so this file documents the
# tuning surface without changing behaviour. Override a single value at
# runtime instead of editing this file:
#
#   ros2 run custom_teleop teleop_wheels_node --ros-args -p max_linear:=0.5
#
# Joint limits are deliberately absent: they are a property of the robot,
# not a tuning knob, and live in coco_config/joint_limits.py, which
# coco_config's test_limits_match_urdf checks against coco_robo2.xacro.

teleop_wheels:
  ros__parameters:
    # Velocity increment per key press (w/s and a/d).
    linear_step: 0.1        # m/s
    angular_step: 0.2       # rad/s
    # Clamp applied after every key press. Kept at or below the
    # diff_drive_controller's own limits in coco_controllers.yaml
    # (1.0 m/s, 2.0 rad/s) so teleop never asks for saturation.
    max_linear: 1.0         # m/s
    max_angular: 2.0        # rad/s
    # Zero the command if no key arrives within this window. This is a
    # convenience watchdog on top of the controller's cmd_vel_timeout
    # (0.5 s), which is the real safety backstop.
    timeout_seconds: 1.0    # s
    # Where the twist goes. The controller's own topic drives the robot
    # directly, which is what you want when running this node alone. During
    # a mission set this to /cmd_vel_teleop so cmd_vel_arbiter mediates —
    # it is the sole publisher to the controller and lets teleop preempt
    # Nav2 and the RL policy.
    cmd_vel_topic: /diff_drive_controller/cmd_vel

teleop_arm:
  ros__parameters:
    # Joint increment per key press (w/s, e/d, r/f).
    step_size: 0.1          # rad
    # time_from_start on each published trajectory point: how long the
    # controller is given to reach the new setpoint.
    move_time: 0.3          # s
